<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="yoshinodaniBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#55A3FF"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="60" cy="60" r="54" fill="url(#yoshinodaniBadge)" stroke="#FFD700" stroke-width="6" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="20,10"/>
  <text x="60" y="75" text-anchor="middle" fill="white" font-size="36" font-weight="bold" font-family="MS Gothic, monospace">吉</text>
  
  <circle cx="43" cy="43" r="2" fill="rgba(255,255,255,0.8)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="77" cy="39" r="1.5" fill="rgba(255,255,255,0.8)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>