<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白山地域探索システム - 詳細統計</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #2c3e50;
            color: #ecf0f1;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #34495e;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #f39c12;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #2c3e50;
            border: 2px solid #f39c12;
            border-radius: 8px;
            padding: 20px;
        }
        .stat-title {
            color: #f39c12;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .stat-value {
            font-size: 24px;
            color: #e74c3c;
            font-weight: bold;
        }
        .stat-detail {
            color: #bdc3c7;
            font-size: 12px;
            margin-top: 5px;
        }
        .chart-container {
            background: #2c3e50;
            border: 2px solid #f39c12;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .region-list {
            list-style: none;
            padding: 0;
        }
        .region-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #34495e;
        }
        .back-link {
            display: inline-block;
            color: #3498db;
            text-decoration: none;
            margin-bottom: 20px;
            padding: 10px 15px;
            border: 1px solid #3498db;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: #3498db;
            color: white;
        }
        .export-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }
        .export-btn:hover {
            background: #229954;
        }
    </style>
</head>
<body>
    <div class="stats-container">
        <a href="index.html" class="back-link">← 白山地域探索システムに戻る</a>
        
        <h1>白山地域探索システム - 詳細統計データ</h1>
        
        <div id="statsContent">
            <p style="text-align: center; color: #95a5a6;">統計データを読み込み中...</p>
        </div>
        
        <button class="export-btn" onclick="exportStats()">データエクスポート</button>
    </div>

    <script type="module" src="real-statistics.js"></script>
    <script>
        // 統計データ読み込み完了まで待機
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                if (window.realStatsSystem) {
                    displayStats();
                } else {
                    document.getElementById('statsContent').innerHTML = 
                        '<p style="text-align: center; color: #e74c3c;">統計システムの読み込みに失敗しました</p>';
                }
            }, 1000);
        });

        function displayStats() {
            const stats = window.realStatsSystem.getAllStats();
            const content = document.getElementById('statsContent');
            
            content.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-title">総訪問回数</div>
                        <div class="stat-value">${stats.totalVisits || 0}</div>
                        <div class="stat-detail">システム起動回数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">総バッジ取得数</div>
                        <div class="stat-value">${stats.totalBadges || 0}</div>
                        <div class="stat-detail">全地域合計</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">アクティブ日数</div>
                        <div class="stat-value">${stats.activeDays || 0}</div>
                        <div class="stat-detail">利用した日数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">平均セッション時間</div>
                        <div class="stat-value">${Math.round((stats.averageSessionTime || 0) / 60)}分</div>
                        <div class="stat-detail">1回あたりの利用時間</div>
                    </div>
                </div>

                <div class="chart-container">
                    <div class="stat-title">地域別訪問データ</div>
                    <ul class="region-list">
                        ${Object.entries(stats.regionVisits || {}).map(([region, count]) => 
                            `<li class="region-item">
                                <span>${region}</span>
                                <span>${count}回</span>
                            </li>`
                        ).join('')}
                    </ul>
                </div>

                <div class="chart-container">
                    <div class="stat-title">レアリティ別取得データ</div>
                    <ul class="region-list">
                        ${Object.entries(stats.rarityDistribution || {}).map(([rarity, count]) => 
                            `<li class="region-item">
                                <span>${rarity}</span>
                                <span>${count}個</span>
                            </li>`
                        ).join('')}
                    </ul>
                </div>
            `;
        }

        function exportStats() {
            if (window.realStatsSystem) {
                const stats = window.realStatsSystem.getAllStats();
                const dataStr = JSON.stringify(stats, null, 2);
                const dataBlob = new Blob([dataStr], {type: 'application/json'});
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `hakusan_stats_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
            }
        }
    </script>
</body>
</html>
