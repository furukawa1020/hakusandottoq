<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>はくさんNFCバッジクエスト</title>
    <meta name="description" content="白山市旧市町村8地域を巡るNFCバッジクエスト">
    <meta name="theme-color" content="#87CEEB">
    <link rel="manifest" href="manifest.json?v=2.7.0">
    <link rel="stylesheet" href="styles.css?v=2.7.0">
    <link rel="icon" href="favicon.svg?v=2.7.0">
    <link rel="preload" href="白山.png?v=2.7.0" as="image" type="image/png">
</head>
<body>
    <header>
        <h1>はくさんNFCバッジクエスト</h1>
        <p>白山市旧市町村8地域を巡る地域探索システム</p>
    </header>

    <div class="main-container">
        <div class="game-status">
            <div class="status-item">
                <span class="icon-badge">★</span>
                <span>攻略地域: <span id="badgeCount">0</span>/8地域</span>
            </div>
            <div class="status-item">
                <span class="icon-mountain">▲</span>
                <span id="currentRegion">探索開始</span>
            </div>
            <div class="status-item">
                <span class="icon-location">●</span>
                <span id="nearestSpot">最寄り: 探索中...</span>
            </div>
        </div>

        <div class="controls-panel">
            <h3>操作方法</h3>
            <p><strong>PC:</strong> WASD または矢印キー</p>
            <p><strong>スマホ:</strong> スワイプで移動</p>
            
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="showBadgeCollection()">
                    <span class="icon-badge">★</span> バッジ一覧
                </button>
                <button class="btn btn-secondary" onclick="openARCamera()">
                    <span class="icon-gallery">▣</span> AR写真
                </button>
                <button class="btn btn-secondary" onclick="openAvatarCustomizer()">
                    <span class="icon-location">●</span> アバター
                </button>
                <button class="btn btn-secondary" id="regionPlacesBtn">
                    <span class="icon-gallery">▣</span> 地域の名所
                </button>
            </div>
        </div>

        <div class="map-container">
            <div style="position: relative; width: 100%; height: 100%;">
                <canvas id="rpgCanvas" width="800" height="600" style="width: 100%; height: 100%; object-fit: cover;"></canvas>
                
                <div style="position: absolute; top: 20px; left: 20px; z-index: 10;">
                    <h3 style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); margin: 0;">はくさん8地域クエストマップ</h3>
                </div>
                
                <div style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); border-radius: 6px; padding: 4px; z-index: 10;" id="miniMapContainer">
                    <h4 style="color: white; margin: 0 0 3px 0; font-size: 9px;">現在位置</h4>
                    <canvas id="miniMapCanvas" width="60" height="45" style="border-radius: 4px;"></canvas>
                </div>
                
                <div style="position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); border-radius: 10px; padding: 15px; z-index: 10; max-width: 250px;">
                    <h4 style="color: white; margin: 0 0 10px 0; font-size: 14px;">地域一覧</h4>
                    <div id="regionList" style="display: flex; flex-direction: column; gap: 5px;"></div>
                </div>
            </div>
        </div>


    </div>

    <!-- メインスクリプト (モジュール) -->
    <script type="module" src="rpg-map-engine.js?v=2.7.0" defer></script>
    <script type="module" src="badge-system.js?v=2.7.0" defer></script>
    <script type="module" src="ar-camera.js?v=2.7.0" defer></script>
    <script type="module" src="avatar-system.js?v=2.7.0" defer></script>
    
    <!-- 補助スクリプト (通常) -->
    <script src="hakusan-gps-system.js?v=2.7.0"></script>
    <script src="hakusan-correct-coords.js?v=2.7.0"></script>
    <script src="hakusan-real-places.js?v=2.7.0"></script>
    <script src="hakusan-real-photos-system.js?v=2.7.0"></script>

    <script>
        // Service Worker登録 - 強制アップデート
        if ('serviceWorker' in navigator) {
            // 既存のService Workerをすべてアンインストール
            navigator.serviceWorker.getRegistrations().then(registrations => {
                registrations.forEach(registration => {
                    registration.unregister();
                    console.log('🗑️ 旧Service Worker削除:', registration.scope);
                });
            });
            
            // 新しいService Workerを登録
            navigator.serviceWorker.register('/sw.js?v=2.6.2')
                .then(registration => {
                    console.log('✅ Service Worker v2.6.2登録:', registration);
                    // 即座に更新を適用
                    registration.update();
                })
                .catch(error => {
                    console.log('❌ Service Worker登録失敗:', error);
                });
        }

        // 🔥 キャッシュクリア＆強制更新システム
        // バージョン管理とキャッシュクリア
        const CURRENT_VERSION = '2.7.0';  // 写真システム完全修正
        const STORED_VERSION = localStorage.getItem('app-version');
        
        if (STORED_VERSION !== CURRENT_VERSION) {
            console.log(`🔄 バージョン更新検出: ${STORED_VERSION} → ${CURRENT_VERSION}`);
            
            // キャッシュをすべてクリア
            if ('caches' in window) {
                caches.keys().then(cacheNames => {
                    cacheNames.forEach(cacheName => {
                        caches.delete(cacheName);
                        console.log('🗑️ キャッシュ削除:', cacheName);
                    });
                });
            }
            
            // バージョン更新
            localStorage.setItem('app-version', CURRENT_VERSION);
            
            // ページを強制リロード（キャッシュなし）
            if (!window.location.search.includes('reloaded')) {
                window.location.href = window.location.pathname + '?reloaded=' + Date.now();
            }
        }

        // 地域名所ボタンの初期化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 はくさんNFCクエスト v2.7.0 起動');
            console.log('✅ AR機能: 有効');
            console.log('✅ GPS機能: 有効（正確な白山市判定）');
            console.log('✅ モバイルUI: 最適化済み');
            console.log('✅ 写真システム: 正確な座標版（各地域3箇所）');
            console.log('✅ 全座標: 実際の場所を調査・修正完了');
            console.log('✅ アバター: 修正済み');
            console.log('🔍 デバッグモード: 有効（詳細ログ出力）');
            
            // 写真システムの即時確認と初期化
            console.log('📸 写真システムチェック開始...');
            console.log('HakusanRealPhotos クラス:', typeof window.HakusanRealPhotos);
            console.log('hakusanRealPhotos インスタンス:', typeof window.hakusanRealPhotos);
            
            setTimeout(() => {
                if (typeof window.HakusanRealPhotos !== 'undefined') {
                    console.log('✅ 写真システムクラス: 読み込み済み');
                    if (!window.hakusanRealPhotos) {
                        window.hakusanRealPhotos = new window.HakusanRealPhotos();
                        console.log('✅ 写真システムインスタンス作成完了');
                    } else {
                        console.log('✅ 写真システムインスタンス: 既に存在');
                    }
                } else {
                    console.error('❌ 写真システムクラスが読み込まれていません');
                    console.error('hakusan-real-photos-system.js が読み込まれているか確認してください');
                }
            }, 1000);
            
            const regionPlacesBtn = document.getElementById('regionPlacesBtn');
            if (regionPlacesBtn) {
                regionPlacesBtn.addEventListener('click', () => {
                    console.log('📍 地域名所ボタンクリック');
                    // 写真付き地域選択モーダルを表示
                    showRegionSelectorWithPhotos();
                });
            }
        });

        // 写真付き地域選択モーダル
        function showRegionSelectorWithPhotos() {
            const regions = [
                { id: 'shiramine', name: '白峰', emoji: '⛰️', desc: '重伝建地区と恐竜化石' },
                { id: 'oguchi', name: '尾口', emoji: '🏔️', desc: 'ホワイトロードとスキー場' },
                { id: 'yoshinodani', name: '吉野谷', emoji: '♨️', desc: '中宮温泉と白山自然' },
                { id: 'torigoe', name: '鳥越', emoji: '🏯', desc: '一向一揆の歴史' },
                { id: 'kawachi', name: '河内', emoji: '🌊', desc: '手取峡谷の美しさ' },
                { id: 'tsurugi', name: '鶴来', emoji: '⛩️', desc: '白山比咩神社' },
                { id: 'mattou', name: '松任', emoji: '🚂', desc: 'トレインパーク白山' },
                { id: 'mikawa', name: '美川', emoji: '🌊', desc: '日本海の漁港と海岸' }
            ];

            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.9); z-index: 9999; display: flex;
                align-items: center; justify-content: center; padding: 20px;
                overflow-y: auto;
            `;

            const buttonsHtml = regions.map(r => `
                <div onclick="showRegionContent('${r.id}'); this.parentElement.parentElement.parentElement.remove();" style="
                    background: linear-gradient(135deg, #87CEEB, #9ACD32);
                    color: white; border: none; padding: 20px; margin: 10px;
                    border-radius: 15px; cursor: pointer;
                    width: calc(50% - 20px); box-shadow: 0 4px 8px rgba(0,0,0,0.2);
                    transition: all 0.3s;
                " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="font-size: 36px; margin-bottom: 10px;">${r.emoji}</div>
                    <div style="font-size: 20px; font-weight: bold; margin-bottom: 5px;">${r.name}</div>
                    <div style="font-size: 13px; opacity: 0.9;">${r.desc}</div>
                </div>
            `).join('');

            modal.innerHTML = `
                <div style="
                    max-width: 700px; width: 100%; background: white;
                    border-radius: 25px; padding: 40px; text-align: center;
                ">
                    <h2 style="color: #2c3e50; margin-bottom: 15px; font-size: 26px;">
                        📍 白山市8地域を選択
                    </h2>
                    <p style="color: #7f8c8d; margin-bottom: 30px; font-size: 14px;">
                        各地域の名所写真とGoogle Maps座標を見ることができます
                    </p>
                    <div style="display: flex; flex-wrap: wrap; justify-content: center;">
                        ${buttonsHtml}
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" style="
                        background: #95a5a6; color: white; border: none;
                        padding: 15px 40px; margin-top: 25px; border-radius: 30px;
                        font-size: 16px; cursor: pointer; transition: all 0.3s;
                    " onmouseover="this.style.background='#7f8c8d'" onmouseout="this.style.background='#95a5a6'">
                        閉じる
                    </button>
                </div>
            `;

            document.body.appendChild(modal);
        }

        // 地域コンテンツを表示（写真 + 名所リスト）
        function showRegionContent(regionId) {
            console.log('🖼️ 地域コンテンツ表示:', regionId);
            
            // 写真システムの確認
            if (typeof window.hakusanRealPhotos !== 'undefined' && window.hakusanRealPhotos) {
                console.log('✅ 写真システム起動');
                window.hakusanRealPhotos.showRegionPhotos(regionId);
            } else if (typeof window.HakusanRealPhotos !== 'undefined') {
                console.log('⚙️ 写真システム初期化中...');
                window.hakusanRealPhotos = new window.HakusanRealPhotos();
                window.hakusanRealPhotos.showRegionPhotos(regionId);
            } else {
                console.error('❌ 写真システムが読み込まれていません');
                alert('写真システムが利用できません。ページを再読み込みしてください。');
                return;
            }
            
            // 0.5秒後に名所リストも表示
            setTimeout(() => {
                if (typeof window.hakusanPlaces !== 'undefined' && window.hakusanPlaces) {
                    console.log('✅ 名所システム起動');
                    window.hakusanPlaces.showRegionPlaces(regionId);
                } else if (typeof window.HakusanRealPlaces !== 'undefined') {
                    console.log('⚙️ 名所システム初期化中...');
                    window.hakusanPlaces = new window.HakusanRealPlaces();
                    window.hakusanPlaces.showRegionPlaces(regionId);
                }
            }, 500);
        }

        // グローバル関数
        window.showBadgeCollection = function() {
            if (window.badgeSystem && window.badgeSystem.showCollectionProgress) {
                window.badgeSystem.showCollectionProgress();
            } else {
                console.warn('バッジシステムが利用できません');
            }
        };

        window.openARCamera = function() {
            console.log('📸 ARカメラ起動中...');
            
            // ARカメラシステムの確認
            if (!window.arCamera) {
                console.log('⚙️ ARカメラシステムを初期化中...');
                
                if (typeof HakusanARCamera === 'undefined') {
                    console.error('❌ HakusanARCamera クラスが読み込まれていません');
                    alert('ARカメラシステムが読み込まれていません。\nページを再読み込みしてください。');
                    return;
                }
                
                try {
                    window.arCamera = new HakusanARCamera();
                    console.log('✅ ARカメラシステム初期化完了');
                } catch (e) {
                    console.error('❌ ARカメラ初期化エラー:', e);
                    alert('ARカメラの初期化に失敗しました。\nエラー: ' + e.message);
                    return;
                }
            }
            
            // カメラを開く
            if (window.arCamera && typeof window.arCamera.open === 'function') {
                console.log('✅ ARカメラを開きます');
                return window.arCamera.open();
            } else if (window.arCamera && typeof window.arCamera.startCamera === 'function') {
                console.log('✅ ARカメラを開きます (startCamera)');
                return window.arCamera.startCamera();
            } else {
                console.error('❌ ARカメラのopenメソッドが見つかりません', window.arCamera);
                alert('ARカメラを開けません。ページを再読み込みしてください。');
            }
        };

        window.openAvatarCustomizer = function() {
            console.log('🎨 アバターカスタマイザー起動中...');
            
            // アバターシステムの確認と初期化
            function tryOpenAvatar() {
                console.log('🔍 アバターシステムチェック:', {
                    avatarSystem: !!window.avatarSystem,
                    HakusanAvatarSystem: typeof HakusanAvatarSystem,
                    modal: !!document.getElementById('avatar-customizer')
                });
                
                // クラスが読み込まれていない場合
                if (typeof HakusanAvatarSystem === 'undefined') {
                    console.error('❌ HakusanAvatarSystem クラスが読み込まれていません');
                    alert('アバターシステムが読み込まれていません。\nページを再読み込みしてください。');
                    return false;
                }
                
                // インスタンスが存在しない場合、作成
                if (!window.avatarSystem) {
                    console.log('⚙️ アバターシステムインスタンス作成中...');
                    try {
                        window.avatarSystem = new HakusanAvatarSystem();
                        console.log('✅ アバターシステムインスタンス作成完了');
                    } catch (e) {
                        console.error('❌ アバターシステムインスタンス作成エラー:', e);
                        alert('アバターシステムの初期化に失敗しました。\nエラー: ' + e.message);
                        return false;
                    }
                }
                
                // モーダル存在確認
                const modal = document.getElementById('avatar-customizer');
                if (!modal) {
                    console.error('❌ アバターモーダルDOM要素が見つかりません');
                    alert('アバターカスタマイザーのUI要素が見つかりません。\nページを再読み込みしてください。');
                    return false;
                }
                
                // openCustomizerメソッド確認
                if (typeof window.avatarSystem.openCustomizer !== 'function') {
                    console.error('❌ openCustomizerメソッドが存在しません');
                    alert('アバターカスタマイザーを開く機能が見つかりません。');
                    return false;
                }
                
                // カスタマイザーを開く
                console.log('✅ アバターカスタマイザーを開きます');
                window.avatarSystem.openCustomizer();
                return true;
            }
            
            // ページ読み込み完了を待つ
            if (document.readyState !== 'complete') {
                console.log('⏳ ページ読み込み待機中...');
                window.addEventListener('load', () => {
                    setTimeout(tryOpenAvatar, 500);
                });
                return;
            }
            
            // すぐに実行
            tryOpenAvatar();
        };

        window.shareBadgeProgress = function() {
            if (window.badgeSystem && window.badgeSystem.shareCollectionProgress) {
                window.badgeSystem.shareCollectionProgress();
            } else {
                console.warn('バッジシステムが利用できません');
            }
        };

        window.showRegionPhotos = function() {
            if (window.hakusanPhotos) {
                window.hakusanPhotos.showPhotoGallery();
            } else {
                console.warn('地域写真システムが利用できません');
            }
        };

        // 簡易アバター選択ダイアログ
        function showSimpleAvatarSelector() {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9000;
            `;
            
            modal.innerHTML = `
                <div style="
                    background: linear-gradient(135deg, #87CEEB 0%, #9ACD32 100%);
                    border-radius: 20px;
                    padding: 30px;
                    max-width: 500px;
                    width: 90%;
                    text-align: center;
                    color: white;
                    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
                ">
                    <h2 style="margin: 0 0 20px 0;">● アバター設定</h2>
                    <p style="margin-bottom: 30px;">アバターシステムを読み込み中です...</p>
                    
                    <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                        <button onclick="selectAvatar('explorer')" style="
                            background: rgba(255,255,255,0.2);
                            border: 2px solid white;
                            color: white;
                            padding: 15px 20px;
                            border-radius: 10px;
                            cursor: pointer;
                            font-weight: bold;
                        ">▲ 探険家</button>
                        
                        <button onclick="selectAvatar('casual')" style="
                            background: rgba(255,255,255,0.2);
                            border: 2px solid white;
                            color: white;
                            padding: 15px 20px;
                            border-radius: 10px;
                            cursor: pointer;
                            font-weight: bold;
                        ">■ カジュアル</button>
                        
                        <button onclick="selectAvatar('outdoor')" style="
                            background: rgba(255,255,255,0.2);
                            border: 2px solid white;
                            color: white;
                            padding: 15px 20px;
                            border-radius: 10px;
                            cursor: pointer;
                            font-weight: bold;
                        ">◆ アウトドア</button>
                    </div>
                    
                    <button onclick="closeAvatarModal()" style="
                        background: rgba(0,0,0,0.3);
                        border: 2px solid white;
                        color: white;
                        padding: 10px 30px;
                        border-radius: 25px;
                        cursor: pointer;
                        margin-top: 30px;
                        font-weight: bold;
                    ">閉じる</button>
                </div>
            `;
            
            modal.onclick = (e) => {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            };
            
            // グローバル関数を定義
            window.selectAvatar = function(type) {
                localStorage.setItem('selectedAvatar', type);
                console.log(`アバタータイプ "${type}" を選択しました`);
                
                // アバター変更の通知
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(154, 205, 50, 0.95);
                    color: white;
                    padding: 20px 30px;
                    border-radius: 15px;
                    z-index: 10000;
                    font-weight: bold;
                    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
                `;
                notification.textContent = `アバターが ${type} に変更されました！`;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    if (notification.parentNode) {
                        document.body.removeChild(notification);
                    }
                }, 2000);
                
                document.body.removeChild(modal);
            };
            
            window.closeAvatarModal = function() {
                document.body.removeChild(modal);
            };
            
            document.body.appendChild(modal);
        }

        // 初期化
        // 初期化処理
        document.addEventListener('DOMContentLoaded', () => {
            console.log('はくさんNFCバッジクエスト初期化開始...');
            
            // アバターシステムの非同期初期化
            setTimeout(() => {
                try {
                    if (window.HakusanAvatarSystem && !window.avatarSystem) {
                        window.avatarSystem = new HakusanAvatarSystem();
                        console.log('アバターシステム初期化完了');
                    }
                } catch (error) {
                    console.log('アバターシステム初期化をスキップ:', error.message);
                }
            }, 1000);
            
            // バッジ数更新
            const updateBadgeCount = () => {
                const savedBadges = localStorage.getItem('hakusanBadges');
                const badgeCount = savedBadges ? JSON.parse(savedBadges).length : 0;
                document.getElementById('badgeCount').textContent = badgeCount;
            };
            
            updateBadgeCount();
            setInterval(updateBadgeCount, 5000);
            
            // 選択されたアバタータイプの表示更新
            const updateAvatarDisplay = () => {
                const selectedAvatar = localStorage.getItem('selectedAvatar') || 'casual';
                const avatarButton = document.querySelector('button[onclick="openAvatarCustomizer()"]');
                if (avatarButton) {
                    const avatarIcons = {
                        'explorer': '▲',
                        'casual': '■', 
                        'outdoor': '◆'
                    };
                    const icon = avatarButton.querySelector('.icon-location');
                    if (icon) {
                        icon.textContent = avatarIcons[selectedAvatar] || '●';
                    }
                }
            };
            
            updateAvatarDisplay();
            
            // RPGエンジンの確実な初期化
            const initializeRPGEngine = () => {
                console.log('🔍 RPGエンジン初期化チェック開始');
                console.log('HakusanRPGEngine:', !!window.HakusanRPGEngine);
                console.log('rpgEngine:', !!window.rpgEngine);
                
                const canvas = document.getElementById('rpgCanvas');
                console.log('Canvas要素:', !!canvas);
                if (canvas) {
                    console.log('Canvas サイズ:', canvas.width, 'x', canvas.height);
                }
                
                if (window.HakusanRPGEngine && !window.rpgEngine) {
                    try {
                        if (canvas) {
                            // 手動初期化関数を使用
                            if (window.initializeRPGFromMain) {
                                window.initializeRPGFromMain();
                            } else {
                                window.rpgEngine = new window.HakusanRPGEngine();
                            }
                            console.log('✅ メインスクリプトからRPGエンジン初期化成功');
                        } else {
                            console.error('❌ RPGCanvas要素が見つかりません');
                        }
                    } catch (error) {
                        console.error('❌ RPGエンジン初期化エラー:', error);
                    }
                } else if (!window.HakusanRPGEngine) {
                    console.log('⏳ HakusanRPGEngineモジュール読み込み待ち...');
                    // モジュール読み込み待ち
                    setTimeout(initializeRPGEngine, 100);
                }
            };
            
            // 少し遅らせてRPGエンジンを初期化
            setTimeout(initializeRPGEngine, 500);
        });
    </script>
</body>
</html>
